# Single source for the home card. One entry per tile.
# Internal tile: `path` (language prefix is added by the template).
# External tile: `url`. Route external ones through /go/<name> so QR codes stay stable.

[[social]]
label = { zh = "文章", en = "Posts", jp = "記事" }
path = "/posts/"
icon = "/icons/posts.svg"

[[social]]
name = "GitHub"
url = "/go/github/"
icon = "/icons/github.svg"

[[social]]
name = "LinkedIn"
url = "/go/linkedin/"
icon = "/icons/linkedin.svg"

[[social]]
name = "Instagram"
url = "/go/instagram/"
icon = "/icons/instagram.svg"

[[social]]
name = "Mail"
url = "mailto:larryhsiao@larryhsiao.com"
icon = "/icons/mail.svg"

